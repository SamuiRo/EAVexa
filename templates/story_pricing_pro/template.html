<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --cyan: #00D4FF;
    --bg: #060D14;
    --surface: #0D1B26;
    --surface2: #122030;
    --border: rgba(0,212,255,0.25);
    --text: #E8F4F8;
    --muted: #5A8099;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Barlow', sans-serif;
    color: var(--text);
  }
  .frame {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    background: var(--bg);
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 54px 54px;
  }
  .accent-top {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--cyan), transparent 60%);
  }
  .side-accent {
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, transparent, var(--cyan) 40%, transparent);
  }
  .corner-tl {
    position: absolute; top: 48px; left: 48px;
    width: 40px; height: 40px;
    border-top: 3px solid var(--cyan); border-left: 3px solid var(--cyan);
  }
  .corner-br {
    position: absolute; bottom: 48px; right: 48px;
    width: 40px; height: 40px;
    border-bottom: 3px solid var(--cyan); border-right: 3px solid var(--cyan);
  }
  .logo-top {
    position: absolute; top: 54px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 14px;
  }
  .logo-dot {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--cyan);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 800; font-style: italic;
    color: var(--cyan);
    box-shadow: 0 0 24px rgba(0,212,255,0.35);
  }
  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 5px;
    color: var(--muted); text-transform: uppercase;
  }
  .content {
    position: absolute;
    top: 200px; left: 80px; right: 80px;
    bottom: 200px;
    display: flex; flex-direction: column;
  }
  .tag-row {
    display: flex; align-items: center; gap: 16px; margin-bottom: 28px;
  }
  .tag {
    display: inline-block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 6px;
    color: var(--cyan); border: 1.5px solid rgba(0,212,255,0.45);
    padding: 6px 18px;
    text-transform: uppercase;
  }
  .badge-popular {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: 3px;
    background: var(--cyan); color: var(--bg);
    padding: 6px 16px; text-transform: uppercase;
  }
  .headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 100px; font-weight: 800; line-height: 0.95;
    color: #fff; text-transform: uppercase; margin-bottom: 20px;
  }
  .headline span { color: var(--cyan); }
  .divider {
    width: 80px; height: 3px; background: var(--cyan);
    margin-bottom: 50px;
  }
  .plan-card {
    background: var(--surface2);
    border: 1.5px solid rgba(0,212,255,0.5);
    padding: 50px 56px;
    margin-bottom: 40px;
    position: relative;
  }
  .plan-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--cyan), transparent);
  }
  .plan-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px; font-weight: 700; letter-spacing: 6px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 16px;
  }
  .plan-price {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 112px; font-weight: 800; line-height: 1;
    color: var(--cyan);
    text-shadow: 0 0 40px rgba(0,212,255,0.4);
    margin-bottom: 8px;
  }
  .plan-duration {
    font-size: 26px; color: var(--muted); margin-bottom: 40px;
  }
  .feature-list { list-style: none; }
  .feature-item {
    display: flex; align-items: flex-start; gap: 20px;
    margin-bottom: 22px;
  }
  .feature-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--cyan); flex-shrink: 0; margin-top: 8px;
    box-shadow: 0 0 10px rgba(0,212,255,0.6);
  }
  .feature-text {
    font-size: 28px; color: var(--text); line-height: 1.3;
  }
  .feature-text.highlight {
    color: var(--cyan); font-weight: 600;
  }
  .cta-btn {
    margin-top: auto;
    display: block;
    background: var(--cyan); color: var(--bg);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px; font-weight: 800; letter-spacing: 6px;
    text-transform: uppercase; padding: 36px 0;
    text-align: center; width: 100%;
  }
  .handle {
    position: absolute; bottom: 60px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 20px;
  }
  .handle-line { flex: 1; max-width: 200px; height: 1px; background: var(--border); }
  .handle-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 4px;
    color: var(--cyan); text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="bg-grid"></div>
  <div class="accent-top"></div>
  <div class="side-accent"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="logo-top">
    <div class="logo-dot">CT</div>
    <span class="logo-text">CoreTune GG</span>
  </div>

  <div class="content">
    <div class="tag-row">
      <div class="tag">Pricing · Pro</div>
      <div class="badge-popular">POPULAR</div>
    </div>
    <div class="headline">$25<br><span>Pro</span></div>
    <div class="divider"></div>

    <div class="plan-card">
      <div class="plan-name">Pro Plan</div>
      <div class="plan-price">$25</div>
      <div class="plan-duration">~50 minutes · one session</div>
      <ul class="feature-list">
        <li class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text highlight">Everything in Starter</span>
        </li>
        <li class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text">FPS benchmark before &amp; after</span>
        </li>
        <li class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text">Windows debloat — junk removal</span>
        </li>
        <li class="feature-item">
          <div class="feature-dot"></div>
          <span class="feature-text">7-day support after the session</span>
        </li>
      </ul>
    </div>

    <div class="cta-btn">DM TO BOOK →</div>
  </div>

  <div class="handle">
    <div class="handle-line"></div>
    <span class="handle-text">@coretunegg</span>
    <div class="handle-line"></div>
  </div>
</div>
</body>
</html>
