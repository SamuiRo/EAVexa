<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    /* Overridden per-frame by VideoRenderer (see docs/specification.md); these
       defaults make a still/image capture land on the fully-revealed frame
       instead of the animation's blank starting state. */
    --eavexa-progress: 1;
    --eavexa-time-ms: 0;

    --magenta: #C838FF;
    --cyan: #37E6FF;
    --bg: #05030A;
    --surface: #120A1F;
    --text: #F2ECFA;
    --muted: #6E5C86;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Barlow', sans-serif;
    color: var(--text);
  }
  .frame {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(200,56,255,0.16), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(55,230,255,0.12), transparent 50%),
      var(--bg);
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(200,56,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(200,56,255,0.05) 1px, transparent 1px);
    background-size: 54px 54px;
  }

  /* Diagonal light sweep — travels once across the full clip, driven purely
     by progress (0..1), no CSS animation timeline involved. */
  .beam {
    position: absolute; top: -20%; left: 0; width: 46%; height: 140%;
    background: linear-gradient(78deg, transparent, rgba(55,230,255,0.14), transparent);
    transform: translateX(calc(var(--eavexa-progress) * 1900px - 340px));
    pointer-events: none;
  }

  .accent-top {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, transparent, var(--magenta) 50%, transparent);
  }
  .corner-tl {
    position: absolute; top: 48px; left: 48px; width: 40px; height: 40px;
    border-top: 3px solid var(--cyan); border-left: 3px solid var(--cyan);
  }
  .corner-br {
    position: absolute; bottom: 48px; right: 48px; width: 40px; height: 40px;
    border-bottom: 3px solid var(--cyan); border-right: 3px solid var(--cyan);
  }

  /* Generic "reveal" — each element carries its own --p threshold ramp
     (set inline, see body below) computed from --eavexa-progress with
     calc()+clamp(), so timing lives with the element, not a stylesheet of
     per-second keyframes. */
  .reveal {
    opacity: var(--p, 1);
    transform: translateY(calc((1 - var(--p, 1)) * 46px));
  }

  .logo-top {
    position: absolute; top: 54px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 14px;
  }
  .logo-dot {
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--magenta);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px; font-weight: 800; font-style: italic;
    color: var(--magenta);
    box-shadow: 0 0 24px rgba(200,56,255,0.4);
  }
  .logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 5px;
    color: var(--muted); text-transform: uppercase;
  }

  .content {
    position: absolute;
    top: 620px; left: 80px; right: 80px;
    display: flex; flex-direction: column;
  }
  .tag {
    display: inline-block; align-self: flex-start;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 6px;
    color: var(--cyan); border: 1.5px solid rgba(55,230,255,0.45);
    padding: 6px 18px; margin-bottom: 28px;
    text-transform: uppercase;
  }
  .headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 108px; font-weight: 800; line-height: 0.96;
    color: #fff; text-transform: uppercase; margin-bottom: 24px;
  }
  .divider {
    height: 3px; background: linear-gradient(90deg, var(--magenta), var(--cyan));
    margin-bottom: 40px;
    width: calc(var(--p, 1) * 140px);
    transition: none;
  }
  .subtitle {
    font-size: 34px; color: var(--muted); line-height: 1.4; margin-bottom: 56px;
    max-width: 820px;
  }
  .tags-row {
    display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 90px;
  }
  .pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 24px; font-weight: 700; letter-spacing: 2px;
    background: var(--surface); color: var(--text);
    border: 1px solid rgba(200,56,255,0.35);
    padding: 14px 26px;
  }

  .cta-btn {
    align-self: flex-start;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 34px; font-weight: 800; letter-spacing: 6px;
    text-transform: uppercase; color: var(--bg);
    background: linear-gradient(90deg, var(--magenta), var(--cyan));
    padding: 28px 56px;
    /* Continuous pulse from elapsed time (radians, not degrees — CSS trig
       functions treat a bare <number> argument as radians). Independent of
       --eavexa-progress on purpose: it should keep breathing at a fixed
       cadence no matter how long the overall clip is. */
    --pulse: calc(0.55 + 0.45 * sin(calc(var(--eavexa-time-ms) * 0.006)));
    box-shadow: 0 0 calc(var(--pulse) * 70px) rgba(200,56,255, calc(var(--pulse) * 0.85));
  }

  .handle {
    position: absolute; bottom: 60px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 20px;
  }
  .handle-line { flex: 1; max-width: 200px; height: 1px; background: rgba(200,56,255,0.25); }
  .handle-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: 4px;
    color: var(--cyan); text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="bg-grid"></div>
  <div class="beam"></div>
  <div class="accent-top"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="logo-top reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.02) / 0.14), 1)">
    <div class="logo-dot">CT</div>
    <span class="logo-text">CoreTune GG</span>
  </div>

  <div class="content">
    <div class="tag reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.12) / 0.14), 1)">Promo</div>

    <div class="headline reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.20) / 0.22), 1)">{{TITLE}}</div>
    <div class="divider" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.24) / 0.20), 1)"></div>

    <div class="subtitle reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.40) / 0.18), 1)">{{SUBTITLE}}</div>

    <div class="tags-row">
      <span class="pill reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.50) / 0.12), 1)">FPS BOOST</span>
      <span class="pill reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.58) / 0.12), 1)">DEBLOAT</span>
      <span class="pill reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.66) / 0.12), 1)">7-DAY SUPPORT</span>
    </div>

    <div class="cta-btn reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.74) / 0.16), 1)">{{CTA}} &rarr;</div>
  </div>

  <div class="handle reveal" style="--p: clamp(0, calc((var(--eavexa-progress) - 0.88) / 0.12), 1)">
    <div class="handle-line"></div>
    <span class="handle-text">{{HANDLE}}</span>
    <div class="handle-line"></div>
  </div>
</div>
</body>
</html>
